title: Safe-Stremio
tagline: Your Secure, Pirate-Friendly Streaming Solution
tagline: Stremio Server and Web behind nginx auth, a rate limit and an optional VPN
description: Docker image that runs Stremio Server and Stremio Web behind nginx, with optional basic auth, a per-IP rate limit and an optional OpenVPN client.
lang: en
url: https://psyb0t.github.io
baseurl: /safe-stremio
repository: psyb0t/safe-stremio
author: Ciprian Mandache

remote_theme: just-the-docs/just-the-docs@v0.12.0
color_scheme: mocha

plugins:
  - jekyll-remote-theme
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-relative-links
  - jekyll-include-cache

permalink: pretty

relative_links:
  enabled: true
  collections: false

defaults:
  - scope:
      path: ""
    values:
      layout: default
      seo:
        type: TechArticle

search:
  heading_level: 3

aux_links:
  GitHub:
    - https://github.com/psyb0t/safe-stremio
aux_links_new_tab: true

nav_external_links:
  - title: Changelog
    url: https://github.com/psyb0t/safe-stremio/blob/master/CHANGELOG.md

gh_edit_link: true
gh_edit_link_text: Edit this page on GitHub
gh_edit_repository: https://github.com/psyb0t/safe-stremio
gh_edit_branch: master
gh_edit_source: docs
gh_edit_view_mode: tree
